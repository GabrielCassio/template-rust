name: rust-template

services:
  app:
    build:
      context: ./apps/example
      dockerfile: Dockerfile
    environment:
      RUST_LOG: info
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
      - backend

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

